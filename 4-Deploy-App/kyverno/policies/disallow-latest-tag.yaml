apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Require an explicit non-latest image tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: application-namespaces
      expression: object.metadata.namespace in ['staging', 'production']
  validations:
    - message: Container images must use an explicit tag or digest.
      expression: >-
        object.spec.containers.all(container,
          container.image.matches('^.+(@[^:]+:[^/]+|:[^/:]+)$')
        )
    - message: The mutable latest image tag is not allowed.
      expression: >-
        object.spec.containers.all(container,
          !container.image.endsWith(':latest')
        )
