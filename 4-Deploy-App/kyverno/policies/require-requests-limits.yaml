apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: application-namespaces
      expression: object.metadata.namespace in ['staging', 'production']
  validations:
    - message: Every container must define CPU and memory requests and limits.
      expression: >-
        object.spec.containers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          'cpu' in container.resources.requests &&
          'memory' in container.resources.requests &&
          has(container.resources.limits) &&
          'cpu' in container.resources.limits &&
          'memory' in container.resources.limits
        )
